<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Red de hospitales</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="min-h-screen bg-gray-100">
  <div id="avisos" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
      <span class="text-lg font-bold text-blue-700">Red de hospitales</span>
      <span id="institucion" class="text-sm text-gray-500"></span>
      <div class="flex-1"></div>
      <div id="datos-usuario" class="text-right"></div>
      <button id="salir" type="button" class="border border-gray-300 rounded px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-100">Salir</button>
    </div>
    <nav id="navegacion" class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto"></nav>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <div id="vista"></div>
  </main>

  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/vistas/pacientes.js"></script>
  <script src="js/vistas/citas.js"></script>
  <script src="js/vistas/consultas.js"></script>
  <script src="js/vistas/historial.js"></script>
  <script src="js/vistas/laboratorio.js"></script>
  <script src="js/vistas/pediatria.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
