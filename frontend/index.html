<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Red de hospitales</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <main class="w-full max-w-sm bg-white rounded-lg shadow p-6">
    <h1 class="text-xl font-semibold mb-6">Iniciar sesión</h1>
    <form id="form-login" class="space-y-4">
      <div>
        <label for="usuario" class="block text-sm mb-1">Usuario</label>
        <input id="usuario" name="usuario" type="text" class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label for="contrasena" class="block text-sm mb-1">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" class="w-full border rounded px-3 py-2">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white rounded py-2">Entrar</button>
    </form>
  </main>
  <script src="js/api.js"></script>
</body>
</html>
